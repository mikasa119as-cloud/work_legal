const D={"today": "2026-09-30", "main": [], "proj": [], "docs": [], "bu": ["PT Eigerindo MPI", "PT Eksonindo MPI", "PT Dua Puluh Tiga", "PT KIND", "PT EEN", "PT 72425", "Owner & Family", "Others"], "dvs": ["Corporate Strategy", "HCGA", "ICT", "ESG", "Marketing", "Operation", "Horeca", "F&A", "Procurement", "31011", "Eiger Camp"], "dps": ["Business Process / QMS", "Strategy & Planning", "Legal & Compliance", "General HCGA", "OD", "TA", "L&D", "HCBP", "Digital", "Infrastruktur", "Conservation & Environment Protection", "Landscape", "ESG Performance", "Digital", "Creative", "PR & Comm", "Offline Partnership", "Brand", "Traffic & Ticketing", "Attraction", "Engineering", "Environmental Services", "General Ops", "Accommodation", "FB", "Kitchen", "Merchandise & Retail", "Finance", "Accounting", "Procurement", "General", "HSE"], "fw": [{"n": "Contract Management", "d": ["1. Kontrak Vendor & Pengadaan (Vendor/Procurement Contracts): Review NDA, Master Service Agreement (MSA), Purchase Order (PO) dengan pihak ketiga.\n\n2. Kontrak Eksternal B2B & Kemitraan (Commercial/Partnership Agreements): Kontrak kerjasama strategis, joint venture, kolaborasi komersial, atau sponsorship.\n\n3. Kontrak Internal & Hubungan Industrial (Internal & Corporate HR): Review PKWT/PKWTT, kebijakan internal (Peraturan Perusahaan), NDA karyawan, atau perjanjian mutasi internal.\n\n4. Template & Archetype Standardisasi: Penyusunan, pembaruan, dan pengelolaan standard template (kontrak baku) agar tim bisnis bisa menggunakan draft awal secara mandiri."]}, {"n": "Compliance & Regulatory / Affairs", "d": ["1. Hubungan & Perizinan Pemerintah (Government & Regulatory Licensing): Pengurusan dan perpanjangan NIB, izin usaha khusus, AMDAL/UKL-UPL, izin operasional kawasan, atau pelaporan berkala ke instansi pemerintah (LKPM, dll.).\n\n2. Sertifikasi Teknis & Standardisasi: Tracker untuk sertifikasi industri, keselamatan kerja (K3), sertifikasi SNI, ISO, atau sertifikasi kelayakan fasilitas.\n\n3. Kepatuhan Privasi Data & Keamanan Informasi: Pemenuhan regulasi terkait perlindungan data pribadi (PDP) konsumen maupun internal.\n\n4. Kepatuhan internal (Internal Compliance & Audit Legal): Sosialisasi regulasi baru ke divisi lain dan audit kepatuhan internal terhadap SOP yang berlaku."]}, {"n": "Corporate Governance", "d": ["1. Dokumentasi RUPS & Direksi: Persiapan, risalah, dan keputusan Rapat Umum Pemegang Saham (RUPS), Rapat Direksi (BOD), atau Dewan Komisaris.\n\n2. Legalitas Perusahaan (Corporate Documents): Pengelolaan Akta Pendirian, Akta Perubahan (direksi/modal), Surat Keputusan Kemenkumham, dan pendaftaran ke Berita Negara.\n\n3. Restrukturisasi & Aksi Korporasi: Pengurusan legalitas jika ada pembentukan anak usaha baru, investasi, merger, atau akuisisi (M&A)."]}, {"n": "Intelectual Property", "d": ["1. Pendaftaran & Proteksi Merek: Pendaftaran merek dagang (trademark), logo, hak cipta produk, atau paten teknologi baru ke DJKI.\n\n2. Perpanjangan & Monitoring IP: Tracker masa berlaku merek (biasanya 10 tahun) dan monitoring jika ada pelanggaran penggunaan merek oleh pihak eksternal."]}, {"n": "Litigation & Dispute Resolution", "d": ["1. Dispute & Somasi: Penanganan klaim, tuntutan dari konsumen/pihak ketiga, atau penerbitan somasi kepada pihak yang wanprestasi.\n\n2. Manajemen Litigasi (Jika ada kasus hukum): Koordinasi dengan external counsel (law firm), persidangan, atau mediasi."]}, {"n": "Asset", "d": []}, {"n": "Risk Management", "d": ["1. Surat Pemberitahuan", "2. Surat Korespondensi", "3. Surat Undangan", "4. Surat Edaran", "5. Surat Pernyataan"]}]};
const tdy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};D.today=tdy();

 [...M,...P].forEach(x=>{x.dur=x.sd&&x.ed?df(x.sd,x.ed):null;x.age=x.sd&&x.st!=='Completed'?df(x.sd,D.today):null});
 DOC.forEach(x=>{x.left=x.ed?df(D.today,x.ed):null;x.st=x.left==null?'noend':x.left<0?'expired':x.left<=90?'soon':'active';x.bad=!!(x.sd&&x.ed&&x.ed<x.sd)});

 od=M.filter(x=>x.st==='In progress'&&x.ed&&x.ed<D.today);dC=cnt(DOC,x=>x.st);pC=cnt(P,x=>x.st);const nb=document.getElementById('nb');if(nb)nb.textContent=BK}

const PAL=['#2563EB','#059669','#D97706','#E11D48','#7C3AED','#0891B2','#CA8A04','#DB2777','#4D7C0F','#475569'];
const SC={Completed:'#059669','In progress':'#D97706',Blocked:'#E11D48','Not started':'#94A3B8'};

const pe=(a,f)=>{let o=Object.entries(cnt(a,f)).sort((x,y)=>y[1]-x[1]).map(([k,v])=>[k||'(kosong)',v]);
 if(o.length>9){const r=o.slice(8).reduce((s,x)=>s+x[1],0);o=[...o.slice(0,8),['Lainnya',r]]}return o};
function pie(e,sz=150){e=e.filter(x=>x[1]>0);const tot=e.reduce((a,x)=>a+x[1],0);if(!tot)return '<div class="mu" style="padding:14px 0">Belum ada data</div>';
 let a=-Math.PI/2,s='';const r=54,col=(x,i)=>x[2]||PAL[i%PAL.length];
 if(e.length===1)s=`<circle cx="60" cy="60" r="${r}" fill="${col(e[0],0)}"><title>${esc(e[0][0])}: ${e[0][1]}</title></circle>`;
 else e.forEach((x,i)=>{const b=a+x[1]/tot*2*Math.PI;s+=`<path d="M60 60L${60+r*Math.cos(a)} ${60+r*Math.sin(a)}A${r} ${r} 0 ${b-a>Math.PI?1:0} 1 ${60+r*Math.cos(b)} ${60+r*Math.sin(b)}Z" fill="${col(x,i)}" stroke="var(--sf)" stroke-width="1.5"><title>${esc(x[0])}: ${x[1]} (${Math.round(x[1]/tot*100)}%)</title></path>`;a=b});
 return `<div class="pie"><svg viewBox="0 0 120 120" width="${sz}" height="${sz}" role="img" aria-label="Diagram pie, total ${tot}">${s}</svg><ul>${e.map((x,i)=>`<li><i style="background:${col(x,i)}"></i>${esc(x[0])}<b>${x[1]}</b><span>${Math.round(x[1]/tot*100)}%</span></li>`).join('')}</ul></div>`}

  <div class="tw ed"><table><thead><tr><th><input type="checkbox" id="sa" aria-label="Pilih semua yang tampil"> #</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody id="eb">${a.map((r,i)=>`<tr data-s="${esc(cols.map(c=>r[c[0]]).join(' ').toLowerCase())}"><td class="nu"><input type="checkbox" data-sel="${i}" aria-label="Pilih baris ${i+1}"> <span class="mu">${i+1}</span></td>${cols.map(c=>`<td>${cell(c,r[c[0]],i)}</td>`).join('')}<td><button class="btn" data-del="${i}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`;
  $('eq').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#eb tr').forEach(r=>r.hidden=!!q&&!r.dataset.s.includes(q))};
  bulkField();live();
}
function selUpd(){const n=$('sel');if(n)n.textContent=SEL.size+' dipilih'}
function bulkField(){const c=COLS[EDS][+$('bf').value];$('bv').innerHTML=cell(c,'',0).replace(/data-i="0" data-k="\w+"/,'id="bval"')}
function bulkChange(t){
 if(t.dataset.sel!=null){t.checked?SEL.add(+t.dataset.sel):SEL.delete(+t.dataset.sel);selUpd()}
 else if(t.id==='sa'){document.querySelectorAll('#eb tr:not([hidden]) [data-sel]').forEach(c=>{c.checked=t.checked;t.checked?SEL.add(+c.dataset.sel):SEL.delete(+c.dataset.sel)});selUpd()}
 else if(t.id==='bf')bulkField()}
function bulkApply(){if(!SEL.size)return msg('Pilih baris dulu');const c=COLS[EDS][+$('bf').value],v=$('bval').value,a=DSET(),n=SEL.size;
 SEL.forEach(i=>{a[i][c[0]]=c[2]==='d'?(v||null):v});touch();vEdit();msg(n+' baris diperbarui')}
function bulkDel(t){if(!SEL.size)return msg('Pilih baris dulu');if(!t.dataset.arm){t.dataset.arm=1;t.textContent='Yakin hapus '+SEL.size+'?';return}
 const a=DSET();[...SEL].sort((x,y)=>y-x).forEach(i=>a.splice(i,1));touch();vEdit()}
$('v').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.ds){EDS=t.dataset.ds;vEdit()}
 else if(t.id==='add'){DSET().push(BLANK[EDS]());touch();vEdit();msg('Baris baru ditambahkan di bawah');const l=$('eb').lastElementChild;l.scrollIntoView();l.querySelector('input').focus()}
 else if(t.dataset.del!=null){if(t.dataset.arm){DSET().splice(+t.dataset.del,1);touch();vEdit()}else{t.dataset.arm=1;t.textContent='Yakin?'}}
 else if(t.id==='exp')doExport();else if(t.id==='bap')bulkApply();else if(t.id==='bdel')bulkDel(t);
 else if(t.id==='rst'){if(t.dataset.arm){try{localStorage.removeItem('lcc-v2')}catch(x){}location.reload()}else{t.dataset.arm=1;t.textContent='Yakin? Semua data dihapus'}}});
$('v').addEventListener('change',e=>{const t=e.target;
 if(t.dataset.k!=null){DSET()[+t.dataset.i][t.dataset.k]=t.type==='date'?(t.value||null):t.value;touch()}
 else if(t.id==='imp')doImport(t.files[0]);else bulkChange(t)});
const iso=v=>typeof v==='number'&&v>25569?new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10):(typeof v==='string'&&/^\d{4}-\d\d-\d\d/.test(v)?v.slice(0,10):null);
const S=v=>v==null?'':String(v).trim();
async function doImport(f){
  if(!f)return;if(!window.XLSX)return msg('Pustaka Excel gagal dimuat');
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const rd=(n,r)=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{range:r,defval:'',raw:true}):null;
  const sst=v=>ST[S(v)]?S(v):'Not started';const out=[];
  const m=rd('Main Tracker',0),p=rd('Project',1),d=rd('Document Lists',0);
  if(m){M.splice(0,M.length,...m.filter(r=>r['Request Lists']||r.Category||r.Status).map(r=>({title:S(r['Request Lists']),bu:S(r['Business Unit']),p:S(r.Priority),dv:S(r.Division),dp:S(r.Department),cat:S(r.Category),st:sst(r.Status),sd:iso(r['Start date']),ed:iso(r['End date']),dl:S(r.Deliverable),note:S(r.Notes)})));out.push(M.length+' permintaan')}
  if(p){let cur='';P.splice(0,P.length,...p.filter(r=>{if(r['Task Project'])cur=S(r['Task Project']);r.__p=cur;return r['Sub Task']}).map(r=>({project:r.__p,sub:S(r['Sub Task']).replace(/\n/g,' '),bu:S(r['Business Unit']),p:S(r.Priority),dv:S(r.Division),dp:S(r.Department),cat:S(r.Category),st:sst(r.Status),sd:iso(r['Start date']),ed:iso(r['End date']),dl:S(r.Deliverable),note:S(r.Notes),pi:S(r.PI),ca:S(r.CA)})));out.push(P.length+' sub-task')}
  if(d){DOC.splice(0,DOC.length,...d.filter(r=>r['Document Name']).map(r=>({name:S(r['Document Name']),dv:S(r.Division),dp:S(r.Department),cat:S(r.Category),inst:S(r['Instansi / 2nd Parties']),sd:iso(r['Start date']),ed:iso(r['End date']),file:S(r.File)})));out.push(DOC.length+' dokumen')}
  if(!out.length)return msg('Sheet Main Tracker, Project, atau Document Lists tidak ditemukan');
  touch();vEdit();msg('Impor selesai: '+out.join(', '))}catch(x){msg('File tidak bisa dibaca')}
}
async function doExport(){
  if(!window.XLSX)return msg('Pustaka Excel gagal dimuat');
  const z=s=>s?{t:'n',v:Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5+25569,z:'yyyy-mm-dd'}:'';
  const n=v=>v==null?'':v,wb=XLSX.utils.book_new(),add=(nm,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),nm);
  const L={'Completed':'✅ Selesai'};
  add('Main Tracker',[['Request Lists','Business Unit','Priority','Division','Department','Category','Status','Start date','End date','SLA','Deliverable','Notes'],...M.map(x=>[x.title,x.bu,x.p,x.dv,x.dp,x.cat,x.st,z(x.sd),z(x.ed),n(x.dur),x.dl,x.note])]);
  add('Project',[['PROJECT'],['Task Project','Sub Task','Business Unit','Priority','Division','Department','Category','Status','Start date','End date','SLA','Deliverable','Notes','PI','CA'],...P.map(x=>[x.project,x.sub,x.bu,x.p,x.dv,x.dp,x.cat,x.st,z(x.sd),z(x.ed),n(x.dur),x.dl,x.note,x.pi,x.ca])]);
  add('Document Lists',[['Document Name','Division','Department','Category','Instansi / 2nd Parties','Start date','End date','Sisa Hari','File','Status'],...DOC.map(x=>[x.name,x.dv,x.dp,x.cat,x.inst,z(x.sd),z(x.ed),n(x.left),x.file,DS[x.st][0]])]);
  const data=XLSX.write(wb,{bookType:'xlsx',type:'array'}),fn='Legal_Compliance_Task_Tracker_edit.xlsx';
  try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:fn,data});return msg('File disimpan')}}catch(x){if(x&&x.code==='declined')return msg('Unduhan dibatalkan')}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=fn;a.click();msg('File diunduh')
}
