const D={"today": "2026-09-30", "main": [], "proj": [], "docs": [], "bu": ["PT Eigerindo MPI", "PT Eksonindo MPI", "PT Dua Puluh Tiga", "PT KIND", "PT EEN", "PT 72425", "Owner & Family", "Others"], "dvs": ["Corporate Strategy", "HCGA", "ICT", "ESG", "Marketing", "Operation", "Horeca", "F&A", "Procurement", "31011", "Eiger Camp"], "dps": ["Business Process / QMS", "Strategy & Planning", "Legal & Compliance", "General HCGA", "OD", "TA", "L&D", "HCBP", "Digital", "Infrastruktur", "Conservation & Environment Protection", "Landscape", "ESG Performance", "Digital", "Creative", "PR & Comm", "Offline Partnership", "Brand", "Traffic & Ticketing", "Attraction", "Engineering", "Environmental Services", "General Ops", "Accommodation", "FB", "Kitchen", "Merchandise & Retail", "Finance", "Accounting", "Procurement", "General", "HSE"], "fw": [{"n": "Contract Management", "d": ["1. Kontrak Vendor & Pengadaan (Vendor/Procurement Contracts): Review NDA, Master Service Agreement (MSA), Purchase Order (PO) dengan pihak ketiga.\n\n2. Kontrak Eksternal B2B & Kemitraan (Commercial/Partnership Agreements): Kontrak kerjasama strategis, joint venture, kolaborasi komersial, atau sponsorship.\n\n3. Kontrak Internal & Hubungan Industrial (Internal & Corporate HR): Review PKWT/PKWTT, kebijakan internal (Peraturan Perusahaan), NDA karyawan, atau perjanjian mutasi internal.\n\n4. Template & Archetype Standardisasi: Penyusunan, pembaruan, dan pengelolaan standard template (kontrak baku) agar tim bisnis bisa menggunakan draft awal secara mandiri."]}, {"n": "Compliance & Regulatory / Affairs", "d": ["1. Hubungan & Perizinan Pemerintah (Government & Regulatory Licensing): Pengurusan dan perpanjangan NIB, izin usaha khusus, AMDAL/UKL-UPL, izin operasional kawasan, atau pelaporan berkala ke instansi pemerintah (LKPM, dll.).\n\n2. Sertifikasi Teknis & Standardisasi: Tracker untuk sertifikasi industri, keselamatan kerja (K3), sertifikasi SNI, ISO, atau sertifikasi kelayakan fasilitas.\n\n3. Kepatuhan Privasi Data & Keamanan Informasi: Pemenuhan regulasi terkait perlindungan data pribadi (PDP) konsumen maupun internal.\n\n4. Kepatuhan internal (Internal Compliance & Audit Legal): Sosialisasi regulasi baru ke divisi lain dan audit kepatuhan internal terhadap SOP yang berlaku."]}, {"n": "Corporate Governance", "d": ["1. Dokumentasi RUPS & Direksi: Persiapan, risalah, dan keputusan Rapat Umum Pemegang Saham (RUPS), Rapat Direksi (BOD), atau Dewan Komisaris.\n\n2. Legalitas Perusahaan (Corporate Documents): Pengelolaan Akta Pendirian, Akta Perubahan (direksi/modal), Surat Keputusan Kemenkumham, dan pendaftaran ke Berita Negara.\n\n3. Restrukturisasi & Aksi Korporasi: Pengurusan legalitas jika ada pembentukan anak usaha baru, investasi, merger, atau akuisisi (M&A)."]}, {"n": "Intelectual Property", "d": ["1. Pendaftaran & Proteksi Merek: Pendaftaran merek dagang (trademark), logo, hak cipta produk, atau paten teknologi baru ke DJKI.\n\n2. Perpanjangan & Monitoring IP: Tracker masa berlaku merek (biasanya 10 tahun) dan monitoring jika ada pelanggaran penggunaan merek oleh pihak eksternal."]}, {"n": "Litigation & Dispute Resolution", "d": ["1. Dispute & Somasi: Penanganan klaim, tuntutan dari konsumen/pihak ketiga, atau penerbitan somasi kepada pihak yang wanprestasi.\n\n2. Manajemen Litigasi (Jika ada kasus hukum): Koordinasi dengan external counsel (law firm), persidangan, atau mediasi."]}, {"n": "Asset", "d": []}, {"n": "Risk Management", "d": ["1. Surat Pemberitahuan", "2. Surat Korespondensi", "3. Surat Undangan", "4. Surat Edaran", "5. Surat Pernyataan"]}]};

function toISO(v){let y,m,d,r;if(v==null||v==='')return null;
 if(typeof v==='number'){if(v<20000||v>80000)return null;const q=new Date(Math.round((v-25569)*864e5));y=q.getUTCFullYear();m=q.getUTCMonth()+1;d=q.getUTCDate()}
 else{const s=S(v);
  if(r=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)){y=+r[1];m=+r[2];d=+r[3]}
  else if(r=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){d=+r[1];m=+r[2];y=+r[3];if(y<100)y+=2000;if(m>12&&d<=12)[d,m]=[m,d]}
  else if(r=s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\.?,?\s+(\d{4})/)){d=+r[1];m=MI[r[2].slice(0,3).toLowerCase()];y=+r[3]}}
 if(!y||!m||!d||m>12||d>31||y<1990||y>2100)return null;return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
const normSt=v=>{const s=nz(v);if(!s||/^(belum|not|todo|open|baru|backlog|new)/.test(s))return 'Not started';if(/complet|selesai|done|closed|finish|beres|tuntas/.test(s))return 'Completed';if(/block|blok|hold|tunda|stuck|pending|kendala/.test(s))return 'Blocked';if(/progress|berjalan|proses|ongoing|wip|dikerjakan|jalan/.test(s))return 'In progress';return 'Not started'};
const normP=v=>{const s=S(v),m=s.match(/^p?\s*([0-3])$/i);if(m)return 'P'+m[1];const l=s.toLowerCase();return /krit|urgent|critical/.test(l)?'P0':/high|tinggi/.test(l)?'P1':/med|sedang|normal/.test(l)?'P2':/low|rendah/.test(l)?'P3':s.toUpperCase()};
const SYN={title:['requestlists','requestlist','request','permintaan','judul','tugas','pekerjaan','perihal','uraian','kegiatan','subject'],bu:['businessunit','bu','unitbisnis','perusahaan','company','entitas'],p:['priority','prioritas','prio'],dv:['division','divisi'],dp:['department','departemen','dept'],cat:['category','kategori','jenis','legalframework','framework','tipe','type'],st:['status','statustugas','progress'],sd:['startdate','mulai','tanggalmulai','start','tglmulai','berlakumulai','tanggaldokumen'],ed:['enddate','selesai','tanggalselesai','end','deadline','tglselesai','duedate','tanggalakhir','berakhir','tanggalberakhir','expired','expiry','masaberlaku','validuntil','jatuhtempo'],dl:['deliverable','output','hasil'],note:['notes','note','catatan','keterangan','remark','remarks'],project:['taskproject','project','proyek','namaproyek'],sub:['subtask','subtugas','subproyek','tahapan'],pi:['pi','penyebab','problemidentification','kendala','masalah'],ca:['ca','correctiveaction','tindakan','tindaklanjut'],name:['documentname','namadokumen','dokumen','document','nama'],inst:['instansi','instansi2ndparties','2ndparties','pihakkedua','counterparty','partner','vendor'],file:['file','filename','namafile','berkas','link']};
function autoMap(hdr,ds){const tr=[];
 COLS[ds].forEach(c=>hdr.forEach((h,ci)=>{const n=nz(h);if(!n)return;let sc=0;(SYN[c[0]]||[]).forEach(s=>{sc=Math.max(sc,n===s?3:(s.length>=4&&n.includes(s))?2:(n.length>=4&&s.includes(n))?1:0)});if(sc)tr.push([sc,c[0],ci])}));
 tr.sort((a,b)=>b[0]-a[0]);const m={},u=new Set();tr.forEach(([s,k,ci])=>{if(m[k]==null&&!u.has(ci)){m[k]=ci;u.add(ci)}});return m}
function hdrRow(aoa){let best=0,bs=-1;const A=aoa.slice(0,15);
 A.forEach((r,i)=>{const sc=r.filter(c=>{const n=nz(c);return n&&Object.values(SYN).some(a=>a.includes(n))}).length;if(sc>bs){bs=sc;best=i}});
 if(bs<=0){const i=A.findIndex(r=>r.filter(c=>S(c)).length>=2);return i<0?0:i}return best}
function guess(sh){const hdr=(sh.aoa[sh.hr]||[]).map(S);let best='skip',bs=0;
 [['main','title',/main|tracker|request|permintaan/i],['proj','sub',/project|proyek/i],['docs','name',/document|dokumen|doc/i]].forEach(([ds,key,rx])=>{const m=autoMap(hdr,ds),h=rx.test(sh.name);const sc=Object.keys(m).length+(m[key]!=null?3:0)+(h?4:0);if((m[key]!=null||h)&&sc>bs){bs=sc;best=ds}});
 sh.t=bs>=3?best:'skip';sh.m=sh.t==='skip'?{}:autoMap(hdr,sh.t)}
const wzRows=sh=>sh.aoa.slice(sh.hr+1).filter(r=>Object.values(sh.m).some(ci=>S(r[ci])!=='')&&!(sh.t==='proj'&&sh.m.sub!=null&&S(r[sh.m.sub])===''));
let WZ=null;
function wzClose(){const e=$('wz');if(e)e.remove();WZ=null}
function wzRender(){const lab={main:'Tracker utama',proj:'Proyek',docs:'Dokumen'};
 $('wz').innerHTML=`<div class="wzb" role="dialog" aria-label="Impor Excel"><h2>Impor: ${esc(WZ.file)}</h2><p class="sub">Kolom dicocokkan otomatis dari judul kolom di file Anda. Periksa dan ubah bila perlu. SLA, sisa hari, dan umur dihitung otomatis.</p>
 <div class="tools"><label><input type="radio" name="wm" value="replace"${WZ.mode==='replace'?' checked':''}> Ganti data yang ada</label><label><input type="radio" name="wm" value="append"${WZ.mode==='append'?' checked':''}> Tambahkan ke data yang ada</label><label><input type="checkbox" id="wx"${WZ.extra?' checked':''}> Bawa kolom lain sebagai kolom tambahan</label></div>
 ${WZ.sheets.map((sh,i)=>{const hdr=(sh.aoa[sh.hr]||[]).map(S);return `<section class="pn" style="margin-top:12px"><div class="tools"><b>${esc(sh.name)}</b><span class="mu">${sh.aoa.length} baris</span>
 <select class="fi" data-w="t" data-s="${i}" aria-label="Tujuan sheet ${esc(sh.name)}"><option value="skip">Lewati sheet ini</option>${Object.keys(lab).map(d=>`<option value="${d}"${sh.t===d?' selected':''}>Jadikan ${lab[d]}</option>`).join('')}</select>
 <label class="mu">Baris judul kolom <input type="number" min="1" class="fi" style="width:70px;min-width:0" data-w="h" data-s="${i}" value="${sh.hr+1}"></label>${sh.t!=='skip'?`<b>${wzRows(sh).length} baris akan diimpor</b>`:''}</div>
 ${sh.t!=='skip'?`<div class="wg">${COLS[sh.t].map(c=>`<label>${c[1]}<select class="fi" data-w="m" data-s="${i}" data-f="${c[0]}"><option value="">(tidak diisi)</option>${hdr.map((h,ci)=>h?`<option value="${ci}"${sh.m[c[0]]===ci?' selected':''}>${esc(h)}</option>`:'').join('')}</select></label>`).join('')}</div>`:''}</section>`}).join('')}
 <div class="tools" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-w="x">Batal</button><button class="btn on" data-w="go">Impor sekarang</button></div></div>`}
function wzEvt(e){const t=e.target,w=t.dataset.w;if(!WZ)return;
 if(t.name==='wm'){WZ.mode=t.value;return}if(t.id==='wx'){WZ.extra=t.checked;return}
 const sh=WZ.sheets[+t.dataset.s];if(!sh)return;
 if(w==='t'){sh.t=t.value;sh.m=sh.t==='skip'?{}:autoMap((sh.aoa[sh.hr]||[]).map(S),sh.t);wzRender()}
 else if(w==='h'){sh.hr=Math.max(0,(+t.value||1)-1);if(sh.t!=='skip')sh.m=autoMap((sh.aoa[sh.hr]||[]).map(S),sh.t);wzRender()}
 else if(w==='m'){if(t.value==='')delete sh.m[t.dataset.f];else sh.m[t.dataset.f]=+t.value;wzRender()}}
function wzApply(){const done={},out=[],NM={main:'permintaan',proj:'sub-task',docs:'dokumen'};
 const addU=(a,v)=>{if(v&&!a.includes(v))a.push(v)};
 WZ.sheets.forEach(sh=>{if(sh.t==='skip')return;const ds=sh.t,A=({main:M,proj:P,docs:DOC})[ds],hdr=(sh.aoa[sh.hr]||[]).map(S),used=new Set(Object.values(sh.m)),body=sh.aoa.slice(sh.hr+1);
  const ex=[];if(WZ.extra)hdr.forEach((h,ci)=>{if(!h||used.has(ci)||/^(sla|sisa ?hari|age|umur|no\.?|#)$/i.test(h)||(ds==='docs'&&/status/i.test(h)))return;if(body.some(r=>S(r[ci])!==''))ex.push([ci,h])});
  let cur='';const objs=[];
  wzRows(sh).forEach(r=>{const o={};COLS[ds].forEach(c=>o[c[0]]=c[2]==='d'?null:'');
   Object.entries(sh.m).forEach(([k,ci])=>{const c=COLS[ds].find(x=>x[0]===k),v=r[ci];o[k]=c[2]==='d'?toISO(v):k==='st'?normSt(v):k==='p'?normP(v):S(v)});
   if(ds!=='docs'&&!o.st)o.st='Not started';
   if(ds==='proj'){if(o.project)cur=o.project;else o.project=cur;if(!o.sub&&sh.m.sub==null)o.sub=o.project;if(!o.sub)return}
   ex.forEach(([ci,h])=>{if(S(r[ci])!=='')o['x_'+h]=S(r[ci])});objs.push(o)});
  ex.forEach(([,h])=>addU(EXTRA[ds],h));
  if(WZ.mode==='replace'&&!done[ds])A.splice(0,A.length);done[ds]=1;
  objs.forEach(o=>{addU(D.bu,o.bu);addU(D.dvs,o.dv);addU(D.dps,o.dp);if(o.cat&&!D.fw.some(f=>f.n===o.cat))D.fw.push({n:o.cat,d:[]});A.push(o)});
  out.push(objs.length+' '+NM[ds])});
 if(!out.length){wzClose();return msg('Tidak ada sheet yang diimpor')}
 wzClose();touch();vEdit();msg('Impor selesai: '+out.join(', '))}
async function doImport(f){
  if(!f)return;if(!window.XLSX)return msg('Pustaka Excel gagal dimuat. Periksa koneksi internet.');
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const sheets=wb.SheetNames.map(n=>({name:n,aoa:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:true,blankrows:false})})).filter(s=>s.aoa.length);
  if(!sheets.length)return msg('File kosong');
  sheets.forEach(s=>{s.hr=hdrRow(s.aoa);guess(s)});
  WZ={file:f.name,sheets,mode:'replace',extra:true};
  const w=document.createElement('div');w.id='wz';w.className='wz';document.body.appendChild(w);
  w.addEventListener('change',wzEvt);w.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;if(b.dataset.w==='x')wzClose();else if(b.dataset.w==='go')wzApply()});
  wzRender()}catch(x){msg('File tidak bisa dibaca')}
}

}
